name: Deploy Backend to musafirbabaserver

# Runs only on the dedicated self-hosted runner registered for this repo
# (label: musafirbabaserver). Only fires when backend/ actually changes on
# main, so frontend/mobile-only pushes never trigger a redeploy here.
# This is fully separate from Vercel's and Render's own deploy pipelines --
# it does not touch either of them.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch: {}

concurrency:
  group: deploy-musafirbabaserver
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: musafirbabaserver
    steps:
      - name: Sync backend/ from main and rebuild the container
        run: |
          cd ~/server/docker/musafirbaba-backend
          git fetch origin main
          git reset --hard origin/main
          docker compose up -d --build

      - name: Verify the container came back up healthy
        run: |
          # The image's HEALTHCHECK has start-period=15s and interval=30s, so
          # Docker can't report "healthy" until ~30s+ after the container
          # starts. A flat `sleep 5` here checked long before that was
          # possible and failed on essentially every deploy regardless of
          # whether the backend actually came up fine. Poll instead, with a
          # generous timeout, so this only fails when the container is truly
          # not healthy.
          for i in $(seq 1 24); do
            status=$(docker ps --filter "name=musafirbaba-backend" --format "{{.Status}}")
            if echo "$status" | grep -q healthy; then
              echo "Deploy verified healthy"
              exit 0
            fi
            echo "Waiting for container to become healthy... ($status)"
            sleep 5
          done
          echo "Container is not healthy after deploy"
          exit 1
